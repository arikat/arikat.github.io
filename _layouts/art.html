<!DOCTYPE html>
<html>

  {% include head.html %}

  <body class="theme-{% if site.resume_theme %}{{ site.resume_theme }}{% endif %} art-page">

    {% include navigation.html %}

    <div class="wrapper">

      <header class="page-header">
        <h1 class="header-name">Art Portfolio</h1>
        <div class="executive-summary">
          <p>I do digital art to relax. I also experiment with voxel art and other 3D mediums.</p>
        </div>
      </header>

      <section class="content-section">
        <div class="album">
          <div class="row">
            {% for artwork in site.data.artworks %}
            <div class="card">
              <img src="{{ artwork.image }}" alt="{{ artwork.title }}" onclick="openModal(this)" />
              <p class="card-text">{{ artwork.title }} ({{ artwork.year }})</p>
            </div>
            {% endfor %}
          </div>
        </div>
      </section>

      <footer class="page-footer">
        <p class="footer-line">
          <a href="/">← Back to Home</a>
        </p>
      </footer>

    </div>

    <!-- Modal for viewing images -->
    <div id="artModal" class="art-modal" onclick="closeModal()">
      <span class="close-modal">&times;</span>
      <img class="modal-content" id="modalImg">
    </div>

    <script>
      function openModal(img) {
        var modal = document.getElementById("artModal");
        var modalImg = document.getElementById("modalImg");
        modal.style.display = "block";
        modalImg.src = img.src;
      }

      function closeModal() {
        document.getElementById("artModal").style.display = "none";
      }

      // Close modal on ESC key
      document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
          closeModal();
        }
      });
    </script>

  </body>

</html>
